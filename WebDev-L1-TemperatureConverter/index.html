<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temperature Converter | Macha Sneha</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">
        <div class="converter-card">

            <h1>🌡️ Temperature Converter</h1>
            <p class="subtitle">Convert Celsius, Fahrenheit and Kelvin easily</p>

            <!-- Temperature Input -->
            <div class="input-group">
                <label for="temperature">Enter Temperature</label>

                <input
                    type="text"
                    id="temperature"
                    placeholder="Enter temperature value"
                >

                <p id="error-message" class="error-message"></p>
            </div>

            <!-- Input Unit -->
            <div class="input-group">
                <label for="unit">Select Input Unit</label>

                <select id="unit">
                    <option value="celsius">Celsius (°C)</option>
                    <option value="fahrenheit">Fahrenheit (°F)</option>
                    <option value="kelvin">Kelvin (K)</option>
                </select>
            </div>

            <!-- Convert Button -->
            <button id="convert-btn">Convert Temperature</button>

            <!-- Results -->
            <div class="result-box">

                <h2>Converted Results</h2>

                <div class="result-item">
                    <span>Celsius</span>
                    <strong id="celsius-result">-- °C</strong>
                </div>

                <div class="result-item">
                    <span>Fahrenheit</span>
                    <strong id="fahrenheit-result">-- °F</strong>
                </div>

                <div class="result-item">
                    <span>Kelvin</span>
                    <strong id="kelvin-result">-- K</strong>
                </div>

            </div>

        </div>
    </div>

    <script src="script.js"></script>

</body>
</html>
